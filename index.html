<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="星穹塔罗 —— 纯前端塔罗占卜互动网页，支持多牌阵、洗牌与翻牌动画、正逆位解读、一键复制。" />
  <title>星穹塔罗 · Starry Tarot</title>
  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png" />
  <!-- 字体：拉丁标题用 Cinzel，中文用 Noto Serif SC（加载失败时回退系统衬线，不影响功能） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=1.3.0" />
  <!-- Three.js CDN ESM（importmap 必须声明在任何使用它的模块之前） -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 背景层：星空粒子画布 + 星云光晕（纯 CSS 动画） -->
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="bg-nebula" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="#" data-nav="home">
      <span class="brand-mark">☾</span>
      <span class="brand-text">星穹塔罗</span>
    </a>
    <div class="header-right">
      <span id="version-badge" class="version-badge" title="当前版本">v1.3.0</span>
      <nav class="site-nav" aria-label="主导航">
        <button class="nav-link" data-nav="spreads">牌阵</button>
        <button class="nav-link" data-nav="3d">3D牌桌</button>
        <button class="nav-link" data-nav="gallery">画廊</button>
        <button class="nav-link" data-nav="about">关于</button>
        <button class="nav-link" data-nav="history">历史</button>
      </nav>
    </div>
  </header>

  <main id="app">
    <!-- ============ 视图一：首页 ============ -->
    <section id="view-home" class="view view-home">
      <h1 class="hero-title">
        <span class="hero-line">星 穹 塔 罗</span>
        <span class="hero-en">STARRY TAROT</span>
      </h1>
      <p class="hero-sub">在星辰的低语中，照见内心的答案</p>

      <!-- 装饰性悬浮卡牌（纯装饰，aria-hidden） -->
      <div class="hero-cards" aria-hidden="true">
        <div class="hero-card hc-1"></div>
        <div class="hero-card hc-2"></div>
        <div class="hero-card hc-3"></div>
      </div>

      <div class="hero-actions">
        <button id="btn-open-spreads" class="btn btn-primary" type="button">☾　选择牌阵</button>
        <button id="btn-quick-draw" class="btn btn-ghost" type="button">✦　单卡速抽</button>
        <button id="btn-gallery" class="btn btn-ghost" type="button">✧　塔罗画廊</button>
        <button id="btn-3d" class="btn btn-ghost" type="button">◈　3D 牌桌</button>
        <button id="btn-about" class="btn btn-ghost" type="button">❀　关于我</button>
        <button id="btn-history" class="btn btn-ghost" type="button">❖　历史记录</button>
      </div>
    </section>

    <!-- ============ 视图二：塔罗画廊（展示全部 78 张卡牌） ============ -->
    <section id="view-gallery" class="view view-gallery hidden">
      <div class="gallery-header">
        <h2 class="section-title">塔罗画廊</h2>
        <p class="section-desc">翻开每一张牌，聆听它藏在星辰里的故事</p>
        <div id="gallery-filters" class="gallery-filters" role="tablist" aria-label="按牌组筛选">
          <button class="filter-chip active" data-filter="all" role="tab" aria-selected="true">全部</button>
          <button class="filter-chip" data-filter="major" role="tab" aria-selected="false">大阿卡纳</button>
          <button class="filter-chip" data-filter="wands" role="tab" aria-selected="false">权杖</button>
          <button class="filter-chip" data-filter="cups" role="tab" aria-selected="false">圣杯</button>
          <button class="filter-chip" data-filter="swords" role="tab" aria-selected="false">宝剑</button>
          <button class="filter-chip" data-filter="pentacles" role="tab" aria-selected="false">星币</button>
        </div>
      </div>
      <div id="gallery-grid" class="gallery-grid"></div>
      <div class="gallery-actions">
        <button class="btn btn-link" data-nav="home" type="button">← 返回首页</button>
      </div>
    </section>

    <!-- ============ 视图三：关于我（个人主页） ============ -->
    <section id="view-about" class="view view-about hidden">
      <div class="about-card">
        <div class="about-avatar-wrap">
          <img class="about-avatar" src="assets/icon/avatar.png" alt="猫咪魔法师头像" />
          <span class="about-avatar-ring" aria-hidden="true"></span>
        </div>
        <h2 class="about-name">1035</h2>
        <p class="about-role">星穹塔罗 · 主理人</p>
        <p class="about-bio">在星辰的低语里，我为你翻开 78 张牌。<br />愿每一张卡面，都能照见你心里那个答案。</p>
        <div class="about-contact">
          <span class="about-email">koka2996978242@outlook.com</span>
          <a class="btn btn-ghost" href="mailto:koka2996978242@outlook.com">✉　发邮件给我</a>
        </div>
        <p class="about-note">仅此邮箱为公开联系方式</p>
        <button class="btn btn-link" data-nav="home" type="button">← 返回首页</button>
      </div>
    </section>

    <!-- ============ 视图四：抽牌 ============ -->
    <section id="view-draw" class="view view-draw hidden">
      <div class="draw-header">
        <h2 id="draw-title" class="section-title"></h2>
        <p id="draw-desc" class="section-desc"></p>
      </div>
      <div id="card-layout" class="card-layout"></div>
      <div class="draw-actions">
        <button id="btn-shuffle" class="btn btn-primary" type="button">♻　洗牌</button>
        <button id="btn-flip-all" class="btn btn-ghost hidden" type="button">◈　全部翻开</button>
        <button id="btn-back-home" class="btn btn-link" type="button">← 返回</button>
      </div>
    </section>

    <!-- ============ 视图五：解读结果 ============ -->
    <section id="view-reading" class="view view-reading hidden">
      <div class="reading-header">
        <h2 id="reading-title" class="section-title"></h2>
        <p id="reading-date" class="reading-date"></p>
      </div>
      <div id="reading-cards" class="reading-cards"></div>
      <div class="reading-actions">
        <button id="btn-copy" class="btn btn-primary" type="button">⧉　一键复制解读</button>
        <button id="btn-save" class="btn btn-ghost" type="button">⌁　保存解读</button>
        <button id="btn-redraw" class="btn btn-ghost" type="button">↻　再抽一次</button>
        <button id="btn-reading-home" class="btn btn-link" type="button">← 返回首页</button>
      </div>
    </section>
    <!-- ============ 视图六：3D 占卜牌桌（v1.3.0） ============ -->
    <section id="view-3d" class="view view-3d hidden">
      <div class="draw-header">
        <h2 class="section-title">3D 占卜牌桌</h2>
        <p class="section-desc">星辰圆桌之上，卡牌自远方飞来 —— 拖拽旋转、滚轮缩放</p>
      </div>
      <div id="tarot-table" class="tarot-table" role="img" aria-label="3D 占卜牌桌场景"></div>
      <div class="draw-actions">
        <button id="btn-3d-spreads" class="btn btn-primary" type="button">☾　选择牌阵占卜</button>
        <button id="btn-3d-flip-all" class="btn btn-ghost hidden" type="button">◈　全部翻开</button>
        <button id="btn-3d-back" class="btn btn-link" type="button">← 返回</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="disclaimer">免责声明：塔罗仅为趣味娱乐，不构成人生、投资、重大决策建议。</p>
    <p class="copy" id="footer-version"></p>
  </footer>

  <!-- ============ 弹窗：牌阵选择 ============ -->
  <div id="modal-spreads" class="modal" role="dialog" aria-modal="true" aria-label="选择牌阵">
    <div class="modal-panel">
      <button class="modal-close" data-close="modal-spreads" aria-label="关闭">✕</button>
      <h3 class="modal-title">选择牌阵</h3>
      <div id="spread-filters" class="spread-filters" role="tablist" aria-label="按主题筛选牌阵">
        <button class="filter-chip active" data-filter="all" role="tab" aria-selected="true">全部</button>
        <button class="filter-chip" data-filter="love" role="tab" aria-selected="false">爱情</button>
        <button class="filter-chip" data-filter="career" role="tab" aria-selected="false">事业</button>
        <button class="filter-chip" data-filter="growth" role="tab" aria-selected="false">成长</button>
        <button class="filter-chip" data-filter="time" role="tab" aria-selected="false">时间</button>
        <button class="filter-chip" data-filter="life" role="tab" aria-selected="false">综合</button>
      </div>
      <div id="spread-list" class="spread-list"></div>
    </div>
  </div>

  <!-- ============ 弹窗：牌阵预览 ============ -->
  <div id="modal-preview" class="modal" role="dialog" aria-modal="true" aria-label="牌阵预览">
    <div class="modal-panel">
      <button class="modal-close" data-close="modal-preview" aria-label="关闭">✕</button>
      <h3 id="preview-name" class="modal-title"></h3>
      <p id="preview-desc" class="modal-desc"></p>
      <div id="preview-meta" class="preview-meta"></div>
      <div id="preview-layout" class="preview-layout"></div>
      <div id="preview-info" class="preview-info"></div>
      <button id="btn-start-draw" class="btn btn-primary btn-block" type="button">✦　开始占卜</button>
    </div>
  </div>

  <!-- ============ 弹窗：历史记录 ============ -->
  <div id="modal-history" class="modal" role="dialog" aria-modal="true" aria-label="历史记录">
    <div class="modal-panel">
      <button class="modal-close" data-close="modal-history" aria-label="关闭">✕</button>
      <h3 class="modal-title">历史记录</h3>
      <div id="history-list" class="history-list"></div>
      <div class="modal-footer">
        <button id="btn-history-clear" class="btn btn-danger btn-block" type="button">清空全部记录</button>
      </div>
    </div>
  </div>

  <!-- ============ 弹窗：历史解读详情 ============ -->
  <div id="modal-detail" class="modal" role="dialog" aria-modal="true" aria-label="解读详情">
    <div class="modal-panel">
      <button class="modal-close" data-close="modal-detail" aria-label="关闭">✕</button>
      <div id="detail-content" class="detail-content"></div>
      <button id="btn-detail-copy" class="btn btn-primary btn-block" type="button">⧉　复制该解读</button>
    </div>
  </div>

  <!-- ============ 弹窗：卡牌详情（画廊用） ============ -->
  <div id="modal-card" class="modal" role="dialog" aria-modal="true" aria-label="卡牌详情">
    <div class="modal-panel modal-panel-card">
      <button class="modal-close" data-close="modal-card" aria-label="关闭">✕</button>
      <div id="card-detail" class="card-detail"></div>
    </div>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data/cards.js?v=1.3.0"></script>
  <script src="js/data/spreads.js?v=1.3.0"></script>
  <script src="js/app.js?v=1.3.0"></script>
  <script type="module" src="js/3d/table3d.js?v=1.3.0"></script>
</body>
</html>
